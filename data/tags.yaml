## Controlled Vocabulary — Tags
## All tags used in source and wiki frontmatter must appear here.
## The validator (scripts/validate.py) rejects unknown tags.

architectures:
  - sm100
  - sm100a
  - sm90
  - sm90a
  - sm120
  # AMD Instinct architectures
  - cdna3   # MI300X / MI300A / gfx942 / gfx940 / gfx941
  - cdna4   # MI350X / MI355X / gfx950

hardware_features:
  - tcgen05
  - tmem
  - tma
  - clc
  - 2sm-cooperative
  - pdl
  - gdc
  - nvfp4
  - fp8
  - fp6
  - fp4
  - block-scale
  - wgmma
  - cluster
  - mbarrier
  - ldmatrix
  - stmatrix
  # AMD CDNA hardware features
  - mfma                 # Matrix Fused Multiply-Add (CDNA tensor cores)
  - mfma-scale-f8f6f4    # CDNA4 block-scaled MXFP MFMA family
  - lds                  # Local Data Share (AMD shared memory)
  - agpr                 # Accumulation VGPR pool used by MFMA
  - buffer-load-lds      # Direct global-to-LDS async load (CDNA3 32b / CDNA4 128b)
  - global-load-lds      # CDNA3 32-bit direct global-to-LDS load variant
  - mxfp4                # OCP MX FP4 (E2M1) with UE8M0 32-elem block scale
  - mxfp6                # OCP MX FP6 (E2M3 / E3M2)
  - mxfp8                # OCP MX FP8 (E4M3 / E5M2)
  - xcd                  # Accelerator Complex Die (CDNA chiplet)
  - infinity-cache       # MALL / memory-attached last-level cache
  - infinity-fabric      # Inter-die / inter-GPU coherent fabric (xGMI)
  - wavefront-64         # 64-lane wavefront (CDNA)
  - s-barrier            # Workgroup-level scalar barrier
  - s-waitcnt            # Memory counter wait (vmcnt / lgkmcnt)
  - xgmi                 # Inter-GPU xGMI link
  - ds-read              # LDS read instruction family (ds_read_b32/b64/b128)
  - ds-write             # LDS write instruction family

